 Rejected.","Any Rejected turns Gate 6 Red; Planned turns it Amber.","Release with the signed record reference in the notes."),holdNotes:J("Quality Hold Point Notes","Acceptance criteria, signatory and record reference.","Text only.","State who signs and what evidence is required."),kpiCp:J("Critical-Path Duration","Longest chain of dependent operations, in working months, for the selected build #.","Forward pass on Elapsed Bay Durations; months = hours ÷ (shifts × hours × working days ÷ 12).","Shorten critical ops or make them parallel — non-critical changes will not help."),kpiWindow:J("Window Utilisation","Critical-path duration ÷ Max Production Window for the active demand case.","Green ≤ 95%, Amber ≤ 100%, Serious ≤ 110%, Red above.","Above 100% each build overlaps the next; provide the concurrent build positions shown."),kpiDrumbeat:J("Drumbeat Margin","Drumbeat Requirement − critical-path duration.","Negative margin forces schedule RAG to Red.","Protect margin for first-of-type builds."),kpiConcurrent:J("Concurrent Builds in WIP","Critical path ÷ production window, rounded up.","Number of units in the factory at once at steady state.","Each needs its own Full-Build Dwell stand set."),esEf:J("Early Start / Early Finish","Earliest an operation can start and finish, in elapsed working hours from build start.","ES = latest EF of its predecessors; EF = ES + duration.","This is the schedule used for resource conflict checks."),lsLf:J("Late Start / Late Finish","Latest an operation can start and finish without delaying the build.","Backward pass from project finish.","Use LS to plan how far a non-critical op can be shifted."),float:J("Total / Task Float","LS − ES: how long the operation can slip without extending the build.","Zero float = critical.","Spend float to resolve Spatial Conflicts in Tabs 6 and 8."),badgeCritical:J("Critical","Zero float: any delay extends the whole build.","Bars are drawn solid dark on the Gantt.","Prioritise materials, people and crane t
