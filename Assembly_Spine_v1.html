rity × Occurrence × Detection (each 1–10).","Align bands with your quality system; any Severity ≥ 9 needs action irrespective of RPN."),integrity:Y("10-Point Model Integrity & Self-Test","Ten live checks on the whole workspace, always factory-wide and independent of the Spine Filter.","Checks 6–8 recompute labour hours, critical path and lift counts with separate code from the main engine.","Do not release (Tab 9, Gate 1) until all ten read GREEN – PASS."),"int.cycle":Y("1 · No Cyclic Predecessors","The predecessor network must be a directed acyclic graph.","A topological sort is attempted; any operation left over sits on a loop.","Open the listed ops in Tab 2 and remove the predecessor that points forwards in time."),"int.refs":Y("2 · Predecessor References Resolve","Every Predecessor # must match an existing Route Code / Op #.","Unresolved references are ignored by the scheduler, which silently shortens the path.","Correct the typo or restore the missing operation."),"int.unique":Y("3 · Unique Op #","Route Code / Op # must be unique and non-blank across all FPDs.","Predecessor links are by Op #, so duplicates make links ambiguous.","Renumber the duplicates; prefix with the FPD number (e.g. F5-040)."),"int.weights":Y("4 · Weights on Lift Ops","Every operation with a lift count needs at least one linked component, each with a weight.","Without a weight the SWL check cannot run and the lift is Red.","Link the component in Tab 2 and enter its weight in Tab 4."),"int.merge":Y("5 · Work-Block Reconciliation","A merged block header must equal the sum of its folded activities.","Compares stored run/touch/manning hours, lifts and moves with the children.","If it fails after a manual JSON edit, unmerge and re-merge the block."),"int.labour":Y("6 · Independent Labour Hours","Σ Manning × Crew × Learning Factor ÷ Efficiency recalculated by a separate loop.","Must match the engine total to within rounding.","A failure indicates a software fault — export the workspace and report
