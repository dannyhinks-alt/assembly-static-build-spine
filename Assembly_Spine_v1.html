t. Every point gained shortens every operation on the critical path."),labourEff:Z("Labour Efficiency %","Achieved output against standard for attended hours.","Labour Hours = Manning × Crew × Learning Factor ÷ Efficiency.","Below 100% inflates labour hours and cost but not bay duration."),envelope:Z("Assigned Factory Floor Boundary","Length × Width of the floor allocated to this factory; area in m².","Sets the drawing extent of the layout canvas and the denominator for allocated-area %.","Keep allocated cell area below roughly 75% of the boundary to leave gangways and lay-down."),layoutImporter:Z("Propel Floor Layout Geometry Importer","Loads zone polygons from JSON, SVG or DXF, or a floor-plan image you trace over.","Coordinates are stored in metres from the top-left corner. Each shape is assigned to a Cell, Main Stores Input, the Multi-Tier Build Stand or the Final Dispatch Bay.","Import the Propel export first; use the image tracer when only a drawing or PDF screenshot exists."),calibration:Z("2-Point Calibration Scale Bar","Click two points a known distance apart, enter that distance, and the image is scaled in metres per pixel.","Scale = real distance ÷ pixel distance. All traced shapes are stored in metres.","Use the longest dimension you trust (e.g. a 40 m reference wall) to minimise scaling error."),snap:Z("Snap Grid","Rounds every traced vertex to the nearest grid increment in metres.","Applies while drawing boxes and polygons.","Use 0.5 m for cell boundaries and 0.1 m for stands."),shapeArea:Z("Shape Area","Polygon area in m² (shoelace formula on the stored vertices).","Shapes nested inside a cell (e.g. the build stand) are not subtracted.","Compare cell area with stand and stillage footprints before adding parallel work."),craneSwl:Z("Primary Crane SWL","Safe working load of the main crane, used when a lift row has no crane tagged.","Lift Utilisation = (component weight + rigging tare) ÷ governing capacity.","Tag the actual crane on each lift row in Tab 2 so its own SWL is used instead."),hookHeight:Z("Vertical Hook Height","Maximum hook-saddle height above finished floor for the primary crane.","Required height = landing elevation + component height + rigging headroom + clearance margin. A shortfall is a Hook-Height Breach (Red).","On a breach use lower-headroom rigging, land at a lower level, or use a crane with more height."),clearance:Z("Safety Lift Clearance Margin","Minimum air gap kept under the suspended load while traversing.","Added to every required hook-height calculation.","Site lifting standard usually dictates this; 0.3 m is a common minimum."),avgLiftCycle:Z("Average Lift Cycle (h)","Hook time per lift when a crane is tagged on a non-Lifting operation.","Crane busy hours = lifts × cycle time (capped at op duration). Dedicated Lifting ops hold the crane for their full duration.","Time a sample of lifts including slinging and unslinging."),tandemDerate:Z("Tandem Lift Derate %","Capacity reduction applied when two or more cranes are tagged on one lift.","Tandem capacity = Σ SWL × (1 − derate).","Follow your Appointed Person's rule; tandem lifts always count as Complex."),tierHeight:Z("Default Stand Floor Height","Elevation gained per stand floor when no stand with its own tier height is tagged.","Landing elevation = Stand Floor Level × tier height.","Enter real platform heights on each stand in Tab 3 for accurate hook checks."),riggingHeadroom:Z("Default Rigging Headroom","Hook-to-load distance assumed when no rigging is tagged.","Used in the required hook-height sum.","Tag the real sling or beam on the row; long chain slings can consume a metre."),thHeavy:Z("Heavy Lift Weight Threshold","Any lift whose load (component + rigging tare) exceeds this value is flagged Heavy Lift.","Compared against every lift row; one of four lift-risk flags.","Heavy lifts need a written lift plan. Lower the threshold if your site standard is stricter."),thMultiPerson:Z("Multi-Person Lift Crew Threshold","Lifts with a crew at or above this size are flagged Multi-Person.","Flags lifts needing slinger/signaller, crane operator and spotter roles.","Confirm named, competent roles for each flagged lift."),thElevation:Z("3D / High-Elevation Lift Threshold","Flags lifts landing at or above this elevation, or at/above the stated stand floor.","Elevation = Stand Floor Level × stand tier height.","Check edge protection, exclusion zones below and line-of-sight for the signaller."),thMultiTool:Z("Multi-Tool / Complex Lift Threshold","Flags lifts using this many rigging/tool items or more, any Complex-class item, or tandem cranes.","Counts rigging + process-rig tags on the row.","Complex lifts need Appointed Person review and usually a trial lift."),thDutyAmber:Z("Duty Cycle — Amber Above","Resource duty above this turns Amber.","Duty = Shifts Used ÷ Programme Shifts.","65% is the usual planning ceiling for a shared crane."),thDutySerious:Z("Duty Cycle — Serious Above","Resource duty above this turns Serious and is flagged HIGH RISK; above 100% is Red.","Also the target loading used to suggest a required quantity.","Above this level any disruption propagates straight to the critical path."),thAr:Z("Attendance Ratio Red Limit","Manning ÷ Run at or above this value flags MACHINE LOCKED LABOUR.","Only tested on rows with a Bay Run Time above the minimum cycle; rows with zero run time are Manual ops and never flag.","100% means Manning Time ≥ Run Time."),thArCycle:Z("Attendance Ratio Minimum Cycle","Operations shorter than this are never flagged on Ar.","Avoids noise from very short tasks.","Leave at 5 min unless you model very short cycles."),thNearCritical:Z("Near-Critical Float Limit","Operations with float at or below this (but above zero) are badged Near-Critical.","Compared with Total Float in elapsed working hours.","Treat near-critical ops as critical when planning cover and spares."),thRpn:Z("PFMEA RPN Bands","RPN at or above each value turns Amber, Serious and Red respectively.","RPN = Severity × Occurrence × Detection (each 1–10).","Align bands with your quality system; any Severity ≥ 9 needs action irrespective of RPN."),integrity:Z("10-Point Model Integrity & Self-Test","Ten live checks on the whole workspace, always factory-wide and independent of the Spine Filter.","Checks 6–8 recompute labour hours, critical path and lift counts with separate code from the main engine.","Do not release (Tab 9, Gate 1) until all ten read GREEN – PASS."),"int.cycle":Z("1 · No Cyclic Predecessors","The predecessor network must be a directed acyclic graph.","A topological sort is attempted; any operation left over sits on a loop.","Open the listed ops in Tab 2 and remove the predecessor that points forwards in time."),"int.refs":Z("2 · Predecessor References Resolve","Every Predecessor # must match an existing Route Code / Op #.","Unresolved references are ignored by the scheduler, which silently shortens the path.","Correct the typo or restore the missing operation."),"int.unique":Z("3 · Unique Op #","Route Code / Op # must be unique and non-blank across all FPDs.","Predecessor links are by Op #, so duplicates make links ambiguous.","Renumber the duplicates; prefix with the FPD number (e.g. F5-040)."),"int.weights":Z("4 · Weights on Lift Ops","Every operation with a lift count needs at least one linked component, each with a weight.","Without a weight the SWL check cannot run and the lift is Red.","Link the component in Tab 2 and enter its weight in Tab 4."),"int.merge":Z("5 · Baseline Work-Block Reconciliation","A merged block header must equal the sum of its folded activities.","Compares stored run/touch/manning hours, lifts and moves with the children.","If it fails after a manual JSON edit, unmerge and re-merge the block."),"int.labour":Z("6 · Independent Labour Hours","Σ Manning × Crew × Learning Factor ÷ Efficiency recalculated by a separate loop.","Must match the engine total to within rounding.","A failure indicates a software fault — export the workspace and report it."),"int.cpm":Z("7 · Independent Critical Path","Longest path through the network found by memoised recursion.","Must equal the forward-pass project duration.","Cannot pass while check 1 fails; fix the loop first."),"int.lifts":Z("8 · Independent Lift Count","Lift count and number of lift operations re-counted from raw rows.","Must match the lift register in Tab 4.","A failure indicates a software fault — export the workspace and report it."),"int.logic":Z("9 · Time Logic & Links","Touch ≤ Manning, no negative times, crew ≥ 1, and every FPD, zone, component and resource tag exists.","Each activity (including those inside blocks) is tested.","Fix the listed operations in Tab 2."),"int.assumptions":Z("10 · Assumptions Confirmed","All entries in the Assumptions Register must be ticked confirmed.","Reads the register in Tab 1.","Chase the named owner; unconfirmed assumptions block Gate 7."),fpdRef:Z("FPD Ref","The Fixed Process Document this row belongs to.","Drives the Spine Filter, per-FPD roll-ups and implicit sequencing.","Create or clone FPDs in the FPD Registry above this table; reassign rows here."),opId:Z("Route Code / Op #","Unique identifier for the operation, used by predecessor links.","Must be unique across the whole spine.","Use an FPD prefix and steps of 10 so operations can be inserted later."),description:Z("Baseline Work Block / Activity Description","Plain-language statement of the work.","Text only — no effect on calculations.","Start with a verb; one activity per row. Use ⤢ for long text."),taskType:Z("Task Type","Sequential or Parallel.","A Sequential row with no predecessor automatically follows the row above it in the same FPD. A Parallel row starts as soon as its listed predecessors finish.","Mark work that can genuinely overlap as Parallel and give it explicit predecessors."),predecessors:Z("Predecessor #","Comma-separated Op # values that must finish first; blank = None.","Finish-to-start links across any FPD. Links to FPDs outside the current filter are ignored and counted in Tab 6.","Link sub-assembly hand-overs across FPDs so the factory critical path is real."),origin:Z("Origin Cell / Zone","Where the work or material starts.","Origin and destination cells are compared to classify the movement.","Leave equal to destination for work that stays put."),destination:Z("Destination Cell / Zone","Where the work is done or material lands.","Labour hours and lifts are booked to the destination cell.","Every row needs a destination zone (integrity check 9)."),movement:Z("Movement Type","Intra-Cell (same cell) or Inter-Cell (crosses a cell boundary).","Derived from origin and destination zones.","Inter-cell moves need a vehicle and a route; minimise them on the critical path."),floorLevel:Z("Stand Floor Level","Stand floor the work or lift lands on: Ground to Level 3.","Landing elevation = level × stand tier height; feeds hook-height and 3D lift checks.","Set accurately on every lift row."),component:Z("Component Name / Description","BOM items handled in this operation (multi-select).","Weights and heights drive the lift load and hook-height checks.","Link only what is actually lifted on lift rows."),crew:Z("Crew Size","People attending the operation.","Total Manning Burden = Manning Time × Crew Size.","Include slinger/signaller and spotters on lifts."),runTime:Z("Equipment / Bay Run Time","Hours a rig, bench or automatic cycle runs for this operation per build. Enter 0 for hand work with no equipment cycle.","Elapsed Bay Duration uses Max(Run, Manning). Zero run time marks the row as a Manual op for the Attendance Ratio.","Include automatic cycles, cure and pressure-hold periods the equipment is tied up for."),touchTime:Z("Operator Touch Time","Hands-on active work hours per build (per operator).","Subtracted from Manning Time to give In-Station Opportunity Time.","Take from time study; it can never exceed Manning Time."),manningTime:Z("Operator Manning Time","Hours an operator must be in attendance, whether working or waiting.","Burden = Manning × Crew. Ar = Manning ÷ Run. Opportunity = Manning − Touch.","Reduce by releasing operators during automatic or hold periods."),burden:Z("Total Manning Burden","Manning Time × Crew Size, in person-hours at baseline.","Scaled by learning factor and efficiency to give Labour Hours.","High burden with low touch time is the first place to look for savings."),elapsed:Z("Elapsed Bay Duration","Max(Run Time, Manning Time) ÷ Net Active Factor × Learning Curve.","This is the duration the CPM scheduler uses for the row.","Shorten by cutting run time, raising the active factor or splitting into parallel work."),ar:Z("Attendance Ratio Ar %",'Manning Time ÷ Bay Run Time. When Bay Run Time is zero there is no equipment cycle, so the row reads "Manual op".',"RED – MACHINE LOCKED LABOUR fires only when Run Time > 5 min (0.083 h) and Manning Time ≥ Run Time: the equipment cycle is holding an operator for its whole duration.","On a Red row look for automatic, cure or hold periods where the operator can be released to adjacent work. Manual ops need no action here."),opportunity:Z("In-Station Opportunity Time","Manning Time − Touch Time: attended but not hands-on.","Summed across the scope as a KPI.","Fill it with kitting, inspection or prep for the next op."),classification:Z("Action Classification","Value-Add (VA), Necessary Non-Value-Add (NNVA) or Pure Waste (NVA).","NVA burden drives Automated Waste %; all three roll up to the VA ratio.","Challenge every NNVA; eliminate every NVA."),actionType:Z("Specific Action Type","What kind of work it is: Administrating, Gathering, Lifting, Welding / Joining, Fastening, Moving, Fitting or Testing.","A Lifting op holds its crane for the whole duration. Choosing Lifting sets the lift count to at least 1.","Split mixed rows so lifting and fitting are separate lines."),tagRigs:Z("Process Rigs & Tooling","Rigs and special tooling needed (multi-select, unlimited).","Each tag books the rig for the elapsed duration and counts toward the Complex Lift item count.","Tag every shared rig so duty cycle and conflicts are visible in Tab 8."),tagCranes:Z("Cranes","Crane(s) used (multi-select). Two or more = tandem lift.","Tagged crane SWL and hook height replace the Tab 1 primary values for this row.","Tag a crane on every lift row."),tagRigging:Z("Rigging & Lifting Gear (L2/L3)","Slings, beams, frames and shackles used (multi-select).","Tare is added to the load, the lowest WLL can govern capacity, the largest headroom feeds the hook check.","Prefer low-headroom gear where hook height is tight."),tagVehicles:Z("Transport Vehicles","AGV, air-skates, forklifts used (multi-select).","Booked for the elapsed duration; concurrency above fleet size is a Spatial Conflict.","Tag vehicles only on rows that really need them."),tagStands:Z("Build & Storage Stands","Stands, jigs and stillages occupied (multi-select).","Full-Build Dwell stands are locked for the whole critical path. A stand tier height sets landing elevation.","Tag the stand on every op performed on it."),liftCount:Z("Lift Count","Number of crane or lifter lifts in the operation per build.","Any row with lifts > 0 enters the Lift Register. With lifts ≥ linked components the heaviest is taken; otherwise weights are summed as one combined lift.","Count each hook-on to hook-off as one lift."),moveCount:Z("Move Count","Number of vehicle or manual transfers in the operation.","Summed as a KPI.","High move counts on short operations indicate poor point-of-use kitting."),notes:Z("Engineering Notes","Free-text method notes, risks or queries.","No effect on calculations; exported with the workspace.","Record the source of time data here."),merge:Z("Merge Selected into Baseline Work Block","Folds the ticked activities (same FPD) into one rolled-up Baseline Work Block.","Block hours, lifts and moves are the sum of the activities, treated as a serial chain. Detail is preserved and still drives lift checks.","Merge to simplify the view; expand ▸ to edit detail; Unmerge at any time with no data loss."),vaSplit:Z("VA / NNVA / NVA Split","Share of manning burden by classification inside the row or block.","Preserved through merging.","A block that is mostly NNVA is a candidate for redesign."),cpmBadge:Z("CPM Schedule Badge","Critical = zero float. Near-Critical = float within the Tab 1 limit. Float = slack available.","From forward/backward pass on elapsed durations in the current filter.","Never add work to a Critical row without checking the production window."),fpdCode:Z("FPD Code","Document number of the Fixed Process Document.","Shown in the Spine Filter and used as the key on Excel import.","Keep identical to the controlled document number."),fpdTitle:Z("FPD Title","Short title of the process document.","Display only.","Use the controlled document title."),bomRef:Z("Sub-Assembly BOM Ref","Top-level BOM the FPD builds.","Display and export only.","Use the ERP BOM number."),assignedCell:Z("Assigned Cell","Cell (1–6) that owns the FPD.","The By Cell filter selects FPDs through this field.","Assign to the cell where most of the work happens."),revision:Z("Revision","Issue level of the FPD.","Exported in summary@V2 for traceability.","Update whenever times or methods change."),fpdActive:Z("Active","Whether the FPD is included in the model.","Inactive FPDs are excluded from every calculation and from Whole Factory.","Untick superseded or draft FPDs instead of deleting them."),fpdClone:Z("Clone FPD","Copies the FPD and all its rows with new Op # values.","Internal predecessor links are re-pointed to the copies; external links are kept.","Use for a variant, then edit only what differs."),cmpWeight:Z("Component Weight (kg)","Mass of one item as lifted.","Feeds lift load, SWL utilisation and the Heavy Lift flag.","Use weighed mass when available; note drawing-nominal weights as an assumption."),cmpDims:Z("Component Dimensions (m)","Length × Width × Height as lifted.","Height feeds the required hook-height calculation.","Enter height in the lifted orientation."),cmpQty:Z("Quantity per Build","Number used on one unit.","Reference only.","Reconcile with the BOM."),resQty:Z("Quantity","Units of this resource available.","Divides duty cycle and sets the limit for concurrent use.","Raise only if the extra unit really exists or is funded."),resSwl:Z("SWL / WLL (kg)","Safe or working load limit.","Cranes and rigging: governs lift capacity (lowest tagged value wins).","Use the current thorough-examination certificate value."),resHook:Z("Hook Height (m)","Maximum hook height of this crane above floor.","Replaces the Tab 1 value when the crane is tagged.","Measure to the hook saddle at the upper limit."),resHeadroom:Z("Rigging Headroom (m)","Vertical distance between hook and top of load with this gear.","Largest tagged headroom feeds the hook check.","Spreader beams and short slings save headroom."),resTare:Z("Tare (kg)","Self-weight of the rigging item.","Added to the lifted load.","Take from the equipment register."),resTiers:Z("Tiers / Tier Height","Number of floors and the height of each.","Landing elevation = Stand Floor Level × tier height.","Enter actual platform height."),resClass:Z("Complexity Class","Simple, Medium or Complex, from the 1–3 Complexity Scoring Matrix: total 4–6 Simple, 7–9 Medium, 10–12 Complex.","Any Complex-class rig, crane, rigging item or stand tagged on a lift row raises the Complex Lift flag.","Challenge Complex scores: simplifying set-up or skill demand removes lift-plan overhead as well."),resDwell:Z("Dwell Mode","Per-Op books the resource only for tagged operations. Full-Build Dwell locks it for the entire critical-path duration.","Full-Build shifts used = critical-path hours ÷ hours per shift.","Use Full-Build for the stand or jig the product sits in from first to last op."),resCell:Z("Home Cell","Where the resource normally lives; blank = shared.","Reference only.","Shared resources are the usual bottlenecks."),cellCrew:Z("Crew per Shift","Operators established in the cell on each shift.","Cell capacity = crew × annual hours. Utilisation = labour hours per build × demand ÷ capacity.","Compare with the Crew Histogram in Tab 6."),cellZones:Z("Zones","Named areas inside a cell.","Rows reference zones; the zone determines the cell.","Add a zone for each distinct lay-down or work position."),cellUtil:Z("Cell Labour Utilisation","Labour hours booked to the cell × annual demand ÷ (crew per shift × annual hours).","Booked by destination zone, for the current filter and build #.","Amber > 80%, Serious > 90%, Red > 100% — rebalance crew or move work."),pfmeaText:Z("PFMEA Description Fields","Failure Mode (how it goes wrong), Effect (consequence), Cause (why), Controls (prevention / detection today), Recommended Action.","Text only.","One failure mode per line; make the action specific and owned."),pfmeaS:Z("Severity (S)","1–10 rating of the effect; 9–10 = safety or regulatory.","RPN = S × O × D.","Severity only changes if the design or process changes the effect."),pfmeaO:Z("Occurrence (O)","1–10 likelihood of the cause occurring.","RPN = S × O × D.","Reduce with prevention controls or error-proofing."),pfmeaD:Z("Detection (D)","1–10: 1 = certain to detect, 10 = cannot detect.","RPN = S × O × D.","Reduce with in-process checks or automatic detection."),rpn:Z("Risk Priority Number","S × O × D, range 1–1,000.","Banded by the Tab 1 RPN thresholds; Closed items do not count against Gate 5.","Work the Red and Serious items first; re-score after action."),pfmeaStatus:Z("Action Status","Open, In Progress or Closed.","Only Open and In Progress items count against Gate 5.","Close only with evidence the action is embedded."),holdType:Z("Hold Point Type","Hold = work stops until released. Witness = third party must be present. Review = record check.","Listed against its Op # for the release gate.","Place Holds before any step that makes inspection impossible."),holdStatus:Z("Hold Point Status","Planned, Released or Rejected.","Any Rejected turns Gate 6 Red; Planned turns it Amber.","Release with the signed record reference in the notes."),holdNotes:Z("Quality Hold Point Notes","Acceptance criteria, signatory and record reference.","Text only.","State who signs and what evidence is required."),kpiCp:Z("Critical-Path Duration","Longest chain of dependent operations, in working months, for the selected build #.","Forward pass on Elapsed Bay Durations; months = hours ÷ (shifts × hours × working days ÷ 12).","Shorten critical ops or make them parallel — non-critical changes will not help."),kpiWindow:Z("Window Utilisation","Critical-path duration ÷ Max Production Window for the active demand case.","Green ≤ 95%, Amber ≤ 100%, Serious ≤ 110%, Red above.","Above 100% each build overlaps the next; provide the concurrent build positions shown."),kpiDrumbeat:Z("Drumbeat Margin","Drumbeat Requirement − critical-path duration.","Negative margin forces schedule RAG to Red.","Protect margin for first-of-type builds."),kpiConcurrent:Z("Concurrent Builds in WIP","Critical path ÷ production window, rounded up.","Number of units in the factory at once at steady state.","Each needs its own Full-Build Dwell stand set."),esEf:Z("Early Start / Early Finish","Earliest an operation can start and finish, in elapsed working hours from build start.","ES = latest EF of its predecessors; EF = ES + duration.","This is the schedule used for resource conflict checks."),lsLf:Z("Late Start / Late Finish","Latest an operation can start and finish without delaying the build.","Backward pass from project finish.","Use LS to plan how far a non-critical op can be shifted."),float:Z("Total / Task Float","LS − ES: how long the operation can slip without extending the build.","Zero float = critical.","Spend float to resolve Spatial Conflicts in Tabs 6 and 8."),badgeCritical:Z("Critical","Zero float: any delay extends the whole build.","Bars are drawn solid dark on the Gantt.","Prioritise materials, people and crane time for these ops."),badgeNear:Z("Near-Critical","Float is above zero but within the near-critical limit.","Limit set in Tab 1 thresholds.","A small delay will make these critical — monitor them."),badgeFloat:Z("Float","Operation has usable slack.","Light bar shows the op; the thin tail shows its float.","Candidates for re-timing to smooth crane and crew demand."),badgeImplicit:Z("Implicit Sequence","This Sequential row has no predecessor entered, so it follows the previous row in its FPD.","Applied by the engine automatically.","Enter explicit predecessors if the assumed order is wrong."),gantt:Z("CPM Gantt","Each bar is one Baseline Work Block on the early-start schedule.","Grouped by FPD; x-axis in working months; dashed line = production window.","Hover a bar for dates, float and predecessors."),external:Z("Out-of-Scope Predecessors","Predecessor links pointing at FPDs outside the current Spine Filter.","Ignored for the filtered schedule, so the filtered path can be shorter than its share of the factory path.","Switch to Whole Factory for the true build duration."),kpiLifts:Z("Total Lifts","Total lift count per build across the current filter.","Sum of Lift Count on every activity, including those inside Baseline Work Blocks.","Fewer, better-planned lifts reduce crane duty and risk exposure."),liftLoad:Z("Lift Load","Component weight + rigging tare.","Heaviest linked component when lifts ≥ components, otherwise the sum (combined lift).","Verify against weighed mass before first lift."),liftCapacity:Z("Governing Capacity","Lowest of crane SWL (or derated tandem capacity) and rigging WLL.","Source shown beneath the value.","If rigging governs, a higher-rated sling may be the cheapest fix."),liftUtil:Z("SWL Utilisation","Lift Load ÷ Governing Capacity.","Serious above 90%, Red above 100%.","Above 90% confirm weight by load cell and remove transit fittings."),hookCheck:Z("Hook-Height Check","Margin = available hook height − (landing elevation + component height + rigging headroom + clearance).","Negative margin is a Hook-Height Breach (Red).","Use low-headroom rigging, land lower, or change crane."),flagHeavy:Z("Heavy Lift","Load exceeds the Heavy Lift threshold.","Threshold set in Tab 1.","Requires a written lift plan."),flagMulti:Z("Multi-Person Lift","Crew at or above the multi-person threshold.","Threshold set in Tab 1.","Assign named slinger/signaller, operator and spotter."),flag3d:Z("3D / High-Elevation Lift","Lands at or above the elevation or stand-floor threshold.","Elevation from Stand Floor Level × tier height.","Plan exclusion zones on lower floors."),flagComplex:Z("Complex Lift","A Complex-class crane, rigging item, rig or stand is tagged on the lift.","Class comes from the Tab 3 Complexity Scoring Matrix.","Appointed Person review; consider a trial lift."),liftRag:Z("Lift Risk RAG","Green: no flags. Amber: 1–2 flags. Serious: 3 or more of the five flags, or > 90% SWL. Red: over capacity, hook-height breach or missing weight.","Worst condition wins. The five flags are Heavy, Multi-Person, 3D Elevation, Complex and Multi-Tool / Tandem.","No Red lift may be released (Gate 3)."),duty:Z("Duty Cycle","Duty Cycle % = Shifts Used ÷ Programme Shifts.","Shifts Used = busy hours per build ÷ hours per shift. Programme Shifts = Max Production Window × shifts per day × quantity. Full-Build Dwell uses the whole critical path.","If Duty Cycle > 65% or a Spatial Conflict fires, shift non-critical tasks within Task Float or add a secondary resource such as a jib crane."),dwell:Z("Dwell","Per-Op or Full-Build.","Full-Build Dwell locks a stand or jig for the entire critical-path build duration rather than a single op.","Release Full-Build resources earlier by moving late operations off the stand."),peakConcurrent:Z("Peak Concurrent Demand","Largest number of overlapping operations needing this resource on the early-start schedule.","Compared with quantity to detect conflicts.","If peak > quantity, re-time within float or add a unit."),requiredQty:Z("Suggested Quantity","Units needed to bring duty to the Serious limit or below.","Rounded up from duty × quantity ÷ limit.","Use as the starting point for a capital case."),spatialConflict:Z("Spatial Conflict","Two operations need the same resource at the same time and there are not enough units.","Detected by sweeping the early-start schedule. Hard = both genuinely hold it; Soft = crane tagged on long ops that only lift occasionally.","Shift the non-critical op within its float, or add a secondary resource."),resolvable:Z("Resolvable Within Float","Yes if one of the two ops can be delayed past the other without extending the build.","Required shift is compared with the op's Total Float.","Apply the suggested shift by adding a predecessor link in Tab 2."),mitigation:Z("Bottleneck Mitigation Strategy","Your plan for the loaded resource.","Free text stored against the resource.","State the action, owner and date."),cellLoad:Z("Cell Labour Load","Labour hours and utilisation by destination cell.","See Tab 1 for crew per shift.","Rebalance crew toward the most loaded cell."),kpiLabour:Z("Total Labour Hours","Σ Manning Time × Crew Size × Learning Factor ÷ Labour Efficiency.","Per build, for the current filter and build #.","Reduce manning time or crew on the largest rows first."),kpiCost:Z("Labour Cost per Build","Total Labour Hours × Labour Rate (£/h).","Rate set in Tab 1.","Use to compare options."),kpiVa:Z("Value-Add Ratio","VA labour hours ÷ total labour hours.","From each activity's classification.","Raise by removing NVA and compressing NNVA."),kpiAr:Z("Machine-Locked Labour Ops","Count of activities flagged RED – MACHINE LOCKED LABOUR (Run Time > 5 min and Manning ≥ Run).","Manual ops with zero Bay Run Time are excluded.","Target the listed rows for operator release during automatic or hold periods."),kpiPeakCrew:Z("Peak Concurrent Crew","Highest total crew working at once on the early-start schedule.","Sum of crew sizes of overlapping activities.","If above headcount, re-time parallel work within float."),gate1:Z("Gate 1 · Model Integrity","Checks 1–9 of the integrity self-test all pass.","Factory-wide, independent of filter.","Fix failing checks in Tab 1."),gate2:Z("Gate 2 · Schedule vs Production Window","Critical path against the active production window and drumbeat.","Uses schedule RAG from Tab 6.","Shorten the critical path or provide concurrent build positions."),gate3:Z("Gate 3 · Lift & Crane Safety","No lift over capacity, no hook-height breach, no missing weight.","Worst lift RAG in the register.","Clear every Red lift in Tab 4."),gate4:Z("Gate 4 · Resource Capacity & Conflicts","Worst resource duty RAG; unresolvable hard conflicts are Red.","From Tabs 6 and 8.","Re-time within float or add capacity."),gate5:Z("Gate 5 · PFMEA Risk","Highest open RPN against the bands.","Closed items are excluded.","Complete actions and re-score."),gate6:Z("Gate 6 · Quality Hold Points","Red if any Rejected; Amber if any still Planned; Green when all Released.","From Tab 5.","Release with signed records."),gate7:Z("Gate 7 · Assumptions","Green when every assumption is confirmed.","Amber for 1–2 open, Serious for more.","Confirm with the named owners."),signoff:Z("Gate Sign-Off","Records who accepted the gate, when, and any comment.","Stored in the workspace and exported in summary@V2.","Sign only when the RAG is acceptable for release."),assumptions:Z("Assumptions Register","Planning assumptions the model depends on.","Unconfirmed entries fail integrity check 10 and Gate 7.","Give each an owner and confirm with evidence."),summaryExport:Z("Export summary@V2 for Master Hub","A compact JSON roll-up for Multi-Factory Master Control Hub.","Always exports the Whole Factory (all active FPDs), with per-cell, per-FPD and per-resource rows plus gate status.","Export after sign-off and import it into the Master Hub."),fpdRoll:Z("Per-FPD Roll-Up","Labour hours, span, lifts and critical-op count for each FPD in the filter.","Span = last early finish − first early start of its rows.","FPDs with many critical ops are where to focus improvement."),cxMatrix:Z("1–3 Complexity Scoring Matrix","Four criteria scored 1 (low) to 3 (high): Technical / Controls, Operator Skill & Certification, Set-Up & Changeover, Upkeep / Calibration / Statutory Exam.","Scores are summed (4–12) and banded into Simple, Medium or Complex. Click a score to cycle 1 → 2 → 3.","Score against the descriptors shown when you hover each cell, not gut feel, so resources are comparable."),floorClaim:Z("Floor Claim","Footprint length × width × quantity, in m².","Summed by home cell and compared with the cell area drawn in the Tab 1 layout.","If claims exceed about 60% of a cell there is too little room left for access, lay-down and lifting paths."),utilities:Z("Utility Services","Services the resource must be connected to (multi-select).","Rolled up into a services-by-cell demand matrix.","Issue the matrix to Facilities early; gas, extraction and demin water have the longest lead times."),utilMatrix:Z("Utility Services by Cell","Number of registered resource units in each cell that need each service.","Shared resources with no home cell are counted in the Shared column.","Use it to size drops and ring mains for each cell."),flagMultiTool:Z("Multi-Tool / Tandem Lift","Two or more cranes (tandem), or rigging / tool items at or above the Tab 1 threshold.","Counts rigging and process-rig tags on the row; tandem capacity is derated.","Minimise the number of items in the load path; each one adds headroom and a failure point."),stackUp:Z("Hook-Height Stack-Up","Landing elevation + component height + rigging headroom + clearance margin = required hook height.","Compared with the available hook height of the tagged crane. The bar shows each layer to scale against the hook limit.","If the stack breaks the limit, the cheapest layer to shorten is usually rigging headroom."),moveDistance:Z("Move Distance","One-way rectilinear distance between the origin and destination zone station points, × move count.","A move that stays inside one zone uses half the side of an equivalent square cell as an allowance.","Long, frequent moves are the first candidates for re-siting in the Tab 7 future layout."),odMatrix:Z("From–To Movement Matrix","Number of moves from each origin cell (rows) to each destination cell (columns).","The diagonal is intra-cell movement.","Heavy off-diagonal flows mean two cells should be adjacent."),pfmeaMulti:Z("Failure Modes per Activity","How many failure modes are recorded against the same BOP activity.","Use ＋ on a line to add another failure mode to the same activity; lines are grouped by Op #.","Most activities carry more than one credible failure mode — a single line is usually a sign of a shallow review."),blindSpot:Z("High-Severity Blind-Spot Watch","Open failure modes with Severity at or above the watch level (8 by default), whatever their RPN.",'A "Blind spot" is high severity with a Green RPN: an RPN-sorted review would never reach it.',"Review every item on the watch list individually and confirm its controls are documented."),controlDoc:Z("Control Doc Required","Required when Severity ≥ watch level, or RPN ≥ Serious, or when ticked manually.","Required with no reference entered shows MISSING and holds Gate 5 at Amber or worse.","Enter the controlled document number (work instruction, lift plan, weld procedure)."),pfmeaResources:Z("Assigned Tooling / Rig / Vehicle / Stand","The equipment the failure mode involves (multi-select).","Pre-filled from the tags on the linked BOP activity when you choose an Op #.","Lets equipment owners see every risk their asset features in."),pfmeaCell:Z("Cell","Cell where the linked activity is carried out.","Derived from the activity's destination zone.","Use the cell summary to see where risk is concentrated."),crewHistogram:Z("Crew Histogram","Total crew working at each point of the build on the early-start schedule.","Step chart of summed crew sizes; the line is the established crew per shift across all cells.","Peaks above the line need re-timing within float, overtime or loaned labour."),spaceClash:Z("Spatial Conflict — Cell / Zone / Stand Level","Three checks on the early-start schedule: work-face congestion, lift into an occupied work face, and lift over or under an occupied level.","Activities are located by destination zone and Stand Floor Level; overlaps in time are tested pair by pair.","Delay the op with float where shown; otherwise plan exclusion windows for each lift."),zoneCap:Z("Max Crew per Level","Largest crew that can work safely on one stand floor level of the zone at once.","Concurrent crew above this value raises a Work-Face Congestion conflict.","Set from access, egress and task risk assessment; leave blank to switch the check off."),zonePos:Z("Zone Station Point","X, Y position of the zone on the floor plan in metres (Current) and the proposed position (Future).","Used for spaghetti distance. Blank Current uses the cell centroid; blank Future means unchanged.","Enter Future positions to test a re-layout before moving anything."),viewMode:Z("Dual-View Layout","Full Factory shows inter-cell flows between all cells. Single Cell zooms to one cell and shows its intra-cell movement.","Line thickness is proportional to move count; the same engine data drives both views.","Use Full Factory to decide adjacency, Single Cell to position stations inside the cell."),spaghetti:Z("Spaghetti Distance — Current","Σ move count × one-way rectilinear distance, in metres per build, with zones at their Current positions.","Follows the Spine Filter.","Attack the longest, most frequent flows first."),spaghettiFuture:Z("Spaghetti Distance — Future","The same sum with zones at their Future positions.","Zones with no Future position stay where they are.","A saving under about 10% rarely justifies a move."),pinchOverlay:Z("3D Pinch-Point Overlay","Marks zones where lifts are flagged 3D Elevation, have a hook margin under 0.15 m or a breach, or where a lift overlaps work on another level.","Marker shows the count and the worst RAG in the zone.","Open the Side-Elevation window for the stand in that zone to see the vertical stack-up."),sideElevation:Z("2D Side-Elevation X–Z Window","Vertical section through a multi-floor stand: floor levels, the crane hook limit and the stack-up of every lift onto that stand.","Each column is one lift op: landing elevation, component, rigging headroom, clearance. A column crossing the dashed hook limit is a breach.","Compare columns to see which layer to shorten or which level to land on."),shiftsUsed:Z("Shifts Used","Shifts the resource is occupied during one build.","Busy elapsed hours ÷ hours per shift. Cranes on non-lifting ops count lifts × average lift cycle.","Reduce by removing the tag from work that does not need the resource."),programmeShifts:Z("Programme Shifts","Shifts available per unit in the Max Production Window, × quantity.","Window months × working days per month × shifts per day.","Changes with demand case, waste % and calendar in Tab 1."),highRisk:Z("HIGH RISK Concurrency","Raised when duty exceeds the Serious limit, or operations that genuinely hold the resource overlap beyond its quantity.","Soft crane overlaps (long ops that only lift occasionally) do not raise it.","Every HIGH RISK resource needs a recorded Bottleneck Mitigation Strategy."),routeToGreen:Z("Route to Green Advisor","For every gate that is not Green, the specific changes that would clear it.","Generated from the live model: days to remove from the critical path, rigging that clears a hook breach, units needed for duty, RPN reduction required.","Work top to bottom; each line links to the tab where the change is made."),chartLabour:Z("Labour Content per Baseline Work Block","Labour hours per build for the largest Baseline work blocks, split VA / NNVA / NVA.","Hours include crew size, learning factor and efficiency.","The top few blocks usually hold most of the hours — improve those first."),chartUtil:Z("High-Risk Resource Utilisation","Duty cycle of the most loaded resources against the Amber and Serious limits.","HIGH RISK resources are labelled.","Anything right of the first tick needs a mitigation."),moveBreakdown:Z("Deep Movement & Lift Breakdown","Lift ops by risk flag, moves by vehicle, inter- vs intra-cell split and spaghetti distance.","Counts are for the current Spine Filter.","Use it to brief the lifting and logistics leads."),pfmeaProfile:Z("PFMEA Risk Profile","Open failure modes by RPN band and by Severity.","Closed items are excluded.","A tall Severity 8–10 column with low RPN is a blind-spot warning."),downloadOffline:Z("Download Offline App (.html)","Saves the complete application as one self-contained file, Assembly_Spine_v1.html.","The file contains all code and styles; it needs no internet connection and opens from a phone or PC file store. Your workspace data is not embedded — export JSON to move data.","Keep a copy alongside your workspace .json file."),baselineHrs:Z("Baseline Hours & Variance","Baseline Hours is the target labour content captured at a known gate (e.g. Freeze), stored separately so the live Manning Hours can drift without losing the original.  Variance = Baseline − Manning (positive = improvement, negative = growth).","Stored per activity row; not recomputed by the engine.  Import from the Master BOP & PFMEA sheet or type here.","Enter Baseline Hours at programme Freeze. Positive variance shows efficiency gain; a row growing past −10% should be investigated for scope change."),sequenceMode:Z("FPD Sequence Mode",'Controls how this FPD connects to others on the CPM schedule.  "Explicit Predecessors / Parallel at Day 0" (default): every inter-FPD link is defined by the Predecessor # column.  "Chain After Previous FPD": the first activity of this FPD implicitly follows the last finish of the FPD immediately above it in the registry.',"The CPM adds an implicit finish-to-start link from the previous FPD's project end to this FPD's Day-0 operations when Chain mode is selected.","Use Chain only for sequential single-line builds where FPDs literally hand over product one after another.  Use Explicit when FPDs share a stand or run in parallel."),riggingAdditive:Z("Additive Σ Rigging Headroom","Every rigging item tagged on a lift contributes its own headroom (chain sling length, spreader bar depth, etc.).  The engine sums all tagged items for the total hook-to-load height.","Required hook height = landing elevation + component height + Σ rigging headroom + clearance margin.  A shortfall is a Hook-Height Breach (Red).","Enter each rigging item's true consumed height in Tab 3.  Using a low-headroom hook block instead of a chain sling can recover half a metre or more."),hookHeightPerCrane:Z("Per-Crane Hook Height Above Floor","The maximum hook-saddle height for this specific crane, measured from finished floor to the crane saddle.  Overrides the global default for every lift tagged to this crane.","Stored on the crane row in Tab 3.  Used in hook-height checks for all lift operations that tag this crane.","Measure from the structural hook attachment point, not the floor below (relevant for cranes on mezzanines or hoist wells).  Enter 0 to inherit the global default."),spaceVerdict:Z("Space Claims Verdict","RAG label comparing equipment floor claim (footprint × qty, from Tab 3) against the cell's allocated area (from Tab 1 polygons).  Over-committed ≥ 90%, Tight 70–90%, Adequate 20–70%, Under-utilised < 20%.","Claim = Σ resource footprint × qty for all resources homed in the cell.  Area = Σ polygon area of shapes tagged cell:id in Tab 1.","Over-committed cells need a layout redesign or equipment removal.  Under-utilised cells may be consolidation candidates or have unrealised capacity."),flowReadiness:Z("Spaghetti Flow Readiness","Zones that appear in BOP move data but have no (X, Y) station point assigned will not appear on the Spaghetti diagram and are excluded from travel-distance totals.","A zone resolves to a position via its explicit pos field, or falls back to the centroid of the cell polygon.  If neither exists the zone is unpositioned.",'Use "Auto-Place Unpositioned Zones" to distribute zones across the factory boundary instantly, then fine-tune positions in Tab 1 or in the Future X/Y table.'),spineFilter:Z("Global Spine Filter","Chooses which FPDs feed every tab: Whole Factory, By Cell, or a Single / Multi-FPD selection, with optional Zone refinement.","All KPIs, CPM, lifts and loads recalculate for the selection. Integrity and the Master Hub export always use the whole factory.","Isolate one FPD to review it; return to Whole Factory for release decisions."),autosave:Z("Auto-Save File Link","Links the workspace to a .json file on disk; every change is then written to it automatically.","Uses the browser File System Access API where available; otherwise changes are kept in this browser's local storage and you export manually.","Link a file on a shared or backed-up drive at the start of each session.")},$m=new Map,Av=e=>{let t=$m.get(e);return t||(t=new Intl.NumberFormat("en-GB",{minimumFractionDigits:e,maximumFractionDigits:e}),$m.set(e,t)),t},xe=(e,t=1)=>e==null||!Number.isFinite(e)?"—":Av(t).format(e),ht=(e,t=1)=>e==null||!Number.isFinite(e)?"—":`${Av(t).format(e)}%`,oe=e=>xe(e,0),Qb=new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:0}),id=e=>e==null||!Number.isFinite(e)?"—":Qb.format(e),jv=e=>{const t=new Date(e);return Number.isNaN(t.getTime())?"—":t.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})},$r={green:"#0ca30c",amber:"#fab219",serious:"#ec835a",red:"#d03b3b"},Ol={green:"Green",amber:"Amber",serious:"Serious",red:"Red"},ld=["green","amber","serious","red"],Ts=e=>e.reduce((t,r)=>ld.indexOf(r)>ld.indexOf(t)?r:t,"green"),aa=e=>ld.indexOf(e),Dn=(e,t=0)=>{const r=typeof e=="number"?e:parseFloat(String(e??"").replac
